<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Tangerine Tab logo. Source for the PNG icons in public/icons (npm run icons). -->
  <defs>
    <radialGradient id="peel" cx="0.38" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="0.55" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#E8620A"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3F9B47"/>
      <stop offset="1" stop-color="#7CC56A"/>
    </linearGradient>
  </defs>
  <!-- fruit -->
  <ellipse cx="64" cy="76" rx="49" ry="42" fill="url(#peel)"/>
  <!-- soft shine -->
  <ellipse cx="44" cy="60" rx="14" ry="8" fill="#FFFFFF" opacity="0.28" transform="rotate(-30 44 60)"/>
  <!-- stem -->
  <path d="M62 35 Q63 27 67 23" stroke="#4A6B2A" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- leaf -->
  <path d="M65 30 C72 14 92 10 106 15 C100 30 84 38 65 30 Z" fill="url(#leaf)"/>
  <path d="M68 29 C80 25 92 20 101 17" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.45" fill="none"/>
</svg>
