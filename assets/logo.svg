<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Tangerine Tab logo. Source for the PNG icons in public/icons (npm run icons). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA53D"/>
      <stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
  </defs>
  <!-- rounded app tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <!-- tangerine (a little wider than tall) -->
  <ellipse cx="64" cy="72" rx="38" ry="34" fill="#FFFFFF"/>
  <!-- leaf -->
  <path d="M64 40 C64 26 76 18 92 20 C90 34 78 40 64 40Z" fill="#34C759"/>
</svg>
